name: Bug Report
description: Create a report to help us fix a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        **Reminder:** Do NOT post security vulnerabilities, classified data, or sensitive tokens here. Email security@aethermask.org instead.
  - type: input
    id: version
    attributes:
      label: AetherMask Version
      description: What version of AetherMask are you running? (e.g. 2.1.0 or commit SHA)
      placeholder: "2.1.0"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Operating Environment
      description: What environment are you running on?
      options:
        - Linux (Air-gapped host / container)
        - Linux (Connected workstation)
        - macOS
        - Windows
        - Docker Compose (offline profile)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide clear, step-by-step instructions and dummy/sanitized data to reproduce the behavior.
      placeholder: |
        1. Ingest sanitized CSV with command `python cli/aethermask.py obfuscate ...`
        2. Attempt restore with `python cli/aethermask.py restore ...`
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior & Error Logs
      description: Paste relevant terminal logs, stack traces, or error messages (ensure no secrets are included).
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Self-Check
      options:
        - label: I confirm that no sensitive, confidential, or proprietary dataset values are present in this report.
          required: true
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
