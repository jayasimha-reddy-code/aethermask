name: CI Suite

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Code Hygiene & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Python Linting & Formatting
        run: |
          ruff check core api cli tests
          ruff format --check core api cli tests

  test-python:
    name: Python Engine & API Tests (${{ matrix.os }} - Py${{ matrix.python-version }})
    needs: lint-and-format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run Test Suite (pytest)
        env:
          AETHERMASK_ARGON2_MEMORY_KIB: 32768
          AETHERMASK_ARGON2_TIME: 2
          AETHERMASK_ARGON2_PARALLELISM: 1
        run: |
          pytest

      - name: Run Verification Suite (Direct Invocation)
        run: |
          python tests/test_full_suite.py
          python tests/test_api.py

  frontend-build:
    name: Frontend SPA Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Test & Source Files
        run: npm test

      - name: Build Production SPA
        run: npm run build

      - name: Verify Dist Artifact
        run: |
          test -f dist/index.html
          test -d dist/assets
